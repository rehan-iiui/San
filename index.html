<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <div id="sky">
    <div id="sun"></div>
    <div id="moon"></div>
    <div id="cloudLayer"></div>
    <div id="rainLayer"></div>
    <div id="fogLayer"></div>
  </div>

  <div id="world">

```
<div class="ground"></div>

<div class="object cube cube1"></div>
<div class="object cube cube2"></div>
<div class="object cube cube3"></div>

<div class="tree tree1">
  <div class="trunk"></div>
  <div class="leaves"></div>
</div>

<div class="tree tree2">
  <div class="trunk"></div>
  <div class="leaves"></div>
</div>

<div id="player">
  <div class="player-head"></div>
  <div class="player-body"></div>
  <div class="player-leg left"></div>
  <div class="player-leg right"></div>
</div>
```

  </div>

  <div id="crosshair">+</div>

  <div id="hud">
    <div class="hud-title">SANDBOX SIMULATOR</div>

```
<div class="hud-info">
  <span>WASD Move</span>
  <span>SPACE Jump</span>
  <span>Click World</span>
</div>

<div id="coordinates">X: 450 Y: 300 Z: 0</div>
<div id="weatherStatus">☀️ Sunny</div>
<div id="timeStatus">☀️ 12:00 PM</div>
<div id="selectedStatus">🧱 Cube selected</div>
```

  </div>

  <!-- WEATHER -->

  <div id="weatherPanel" class="panel">

```
<div class="panel-title">WEATHER</div>

<button class="weatherButton active" data-weather="sunny">
  ☀️ Sunny
</button>

<button class="weatherButton" data-weather="cloudy">
  ☁️ Cloudy
</button>

<button class="weatherButton" data-weather="rain">
  🌧️ Rain
</button>

<button class="weatherButton" data-weather="fog">
  🌫️ Fog
</button>

<button id="dayNightButton">
  🌙 Night
</button>
```

  </div>

  <!-- WORLD MENU -->

  <div id="worldPanel" class="panel">

```
<div class="panel-title">WORLD</div>

<button id="saveWorld">💾 Save</button>
<button id="loadWorld">📂 Load</button>
<button id="clearWorld">🗑️ Clear</button>
<button id="resetPlayer">↩️ Reset Player</button>
```

  </div>

  <!-- OBJECT TOOLBAR -->

  <div id="toolbar">

```
<button class="tool active" data-object="cube">
  🧱
  <span>Cube</span>
</button>

<button class="tool" data-object="tree">
  🌳
  <span>Tree</span>
</button>

<button class="tool" data-object="ball">
  ⚽
  <span>Ball</span>
</button>

<button class="tool" data-object="crate">
  📦
  <span>Crate</span>
</button>

<button class="tool" data-object="water">
  🌊
  <span>Water</span>
</button>

<button class="tool" data-object="fire">
  🔥
  <span>Fire</span>
</button>

<button class="tool" data-object="wall">
  🧱
  <span>Wall</span>
</button>

<button id="deleteMode">
  🗑️
  <span>Delete</span>
</button>

<button id="editorButton">
  🛠️
  <span>Editor</span>
</button>

<button id="settingsButton">
  ⚙️
  <span>Settings</span>
</button>
```

  </div>

  <!-- EDITOR -->

  <div id="editorPanel" class="floatingPanel hidden">

```
<div class="panel-title">OBJECT EDITOR</div>

<label>
  Size
  <input id="sizeSlider" type="range" min="30" max="150" value="65">
</label>

<label>
  Rotation
  <input id="rotationSlider" type="range" min="0" max="360" value="0">
</label>

<button id="applyEditor">Apply to New Objects</button>
```

  </div>

  <!-- SETTINGS -->

  <div id="settingsPanel" class="floatingPanel hidden">

```
<div class="panel-title">SIMULATOR SETTINGS</div>

<label class="settingRow">
  <span>Player Speed</span>
  <input id="speedSlider" type="range" min="1" max="10" value="4">
</label>

<label class="settingRow">
  <span>Grid</span>
  <input id="gridToggle" type="checkbox" checked>
</label>

<label class="settingRow">
  <span>Animations</span>
  <input id="animationToggle" type="checkbox" checked>
</label>

<button id="closeSettings">Close</button>
```

  </div>

  <!-- MOBILE CONTROLS -->

  <div id="controls">

```
<div class="control-row">
  <button data-key="w">W</button>
</div>

<div class="control-row">
  <button data-key="a">A</button>
  <button data-key="s">S</button>
  <button data-key="d">D</button>
</div>

<button id="jumpButton">SPACE</button>
```

  </div>

  <div id="toast"></div>

</div>

<script src="script.js"></script>

</body>
</html>
