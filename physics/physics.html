<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox Physics</title>
</head>
<body>

  <!-- Physics feature definition -->

  <div id="physics-feature">

    <div class="physics-setting" data-property="gravity">
      Gravity
    </div>

    <div class="physics-setting" data-property="bounce">
      Bounce
    </div>

    <div class="physics-setting" data-property="weight">
      Weight
    </div>

    <div class="physics-setting" data-property="collision">
      Collision
    </div>

    <div class="physics-setting" data-property="friction">
      Friction
    </div>

  </div>

</body>
</html>
