<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game">

    <!-- SKY / WEATHER -->
    <div id="sky">
      <div id="sun"></div>
      <div id="moon"></div>
      <div id="cloudLayer"></div>
      <div id="rainLayer"></div>
      <div id="fogLayer"></div>
    </div>

    <!-- WORLD -->
    <div id="world">

      <div class="ground"></div>

      <!-- Existing objects -->
      <div class="object cube cube1"></div>
      <div class="object cube cube2"></div>
      <div class="object cube cube3"></div>

      <div class="tree tree1">
        <div class="trunk"></div>
        <div class="leaves"></div>
      </div>

      <div class="tree tree2">
        <div class="trunk"></div>
        <div class="leaves"></div>
      </div>

      <!-- Player -->
      <div id="player">
        <div class="player-head"></div>
        <div class="player-body"></div>
        <div class="player-leg left"></div>
        <div class="player-leg right"></div>
      </div>

    </div>

    <!-- CROSSHAIR -->
    <div id="crosshair">+</div>

    <!-- HUD -->
    <div id="hud">

      <div class="hud-title">
        SANDBOX SIMULATOR
      </div>

      <div class="hud-info">
        <span>WASD Move</span>
        <span>SPACE Jump</span>
        <span>Mouse Look</span>
      </div>

      <div id="coordinates">
        X: 450 &nbsp; Y: 300 &nbsp; Z: 0
      </div>

      <div id="weatherStatus">
        ☀️ Sunny
      </div>

      <div id="timeStatus">
        🕛 12:00 PM
      </div>

    </div>

    <!-- WEATHER PANEL -->
    <div id="weatherPanel">

      <div class="panel-title">
        WEATHER
      </div>

      <button class="weatherButton active" data-weather="sunny">
        ☀️ Sunny
      </button>

      <button class="weatherButton" data-weather="cloudy">
        ☁️ Cloudy
      </button>

      <button class="weatherButton" data-weather="rain">
        🌧️ Rain
      </button>

      <button class="weatherButton" data-weather="fog">
        🌫️ Fog
      </button>

      <button id="dayNightButton">
        🌙 Night
      </button>

    </div>

    <!-- OBJECT TOOLBAR -->
    <div id="toolbar">

      <button class="tool active" data-object="cube">
        🧱
        <span>Cube</span>
      </button>

      <button class="tool" data-object="tree">
        🌳
        <span>Tree</span>
      </button>

      <button class="tool" data-object="ball">
        ⚽
        <span>Ball</span>
      </button>

      <button class="tool" data-object="crate">
        📦
        <span>Crate</span>
      </button>

      <button id="deleteMode">
        🗑️
        <span>Delete</span>
      </button>

    </div>

    <!-- MOBILE CONTROLS -->
    <div id="controls">

      <div class="control-row">
        <button data-key="w">W</button>
      </div>

      <div class="control-row">
        <button data-key="a">A</button>
        <button data-key="s">S</button>
        <button data-key="d">D</button>
      </div>

      <button id="jumpButton">
        SPACE
      </button>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
