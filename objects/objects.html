<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandbox Objects</title>
</head>
<body>

  <!-- Objects feature definition -->

  <div id="objects-feature">

    <div class="object-definition" data-type="cube">
      Cube
    </div>

    <div class="object-definition" data-type="tree">
      Tree
    </div>

    <div class="object-definition" data-type="ball">
      Ball
    </div>

    <div class="object-definition" data-type="crate">
      Crate
    </div>

  </div>

</body>
</html>
